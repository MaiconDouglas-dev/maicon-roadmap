<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap do Maicon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e8590c'/><text x='16' y='22' font-size='17' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --card: #ffffff; --chip: #f7f7f5; --text: #17181c; --muted: #6b7079; --line: #e6e6e3;
    --node: #1d2027; --node-text: #ffffff; --curve: #d9b99b; --accent: #e8590c; --accent-soft: #fff1e8;
    --done: #2b8a3e; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --chip: #1d212a; --text: #e8eaee; --muted: #9098a6; --line: #2a2f3a;
      --node: #f1f2f4; --node-text: #15171c; --curve: #6b5644; --accent: #ff8a3d; --accent-soft: #2a1b10;
      --done: #51cf66; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 40px 24px 80px; transition: margin-right .25s; }
  body.drawer-open .wrap { margin-right: 440px; }

  header { text-align: center; max-width: 640px; margin: 0 auto 36px; }
  header h1 { font-size: 36px; font-weight: 800; letter-spacing: -0.03em; margin: 0; display: flex; gap: 12px;
    justify-content: center; align-items: center; }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 22px;
    display: grid; place-items: center; }
  header .sub { color: var(--muted); margin: 6px 0 12px; }
  header .goal b { font-weight: 600; }
  .overall { display: flex; align-items: center; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0 14px; font-size: 13px; color: var(--muted); }
  .overall .bar { width: 220px; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .overall .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .tools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  button, .btn { font: 500 13px Inter, sans-serif; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); cursor: pointer; }
  button:hover, .btn:hover { border-color: var(--accent); }

  /* mapa */
  .map { position: relative; }
  .map::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--curve); }
  .cat { position: relative; display: grid; grid-template-columns: 1fr 216px 1fr; column-gap: 64px; padding: 28px 0; }
  .cat svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .cat svg path { fill: none; stroke: var(--curve); stroke-width: 1.5; }
  .col { display: flex; flex-direction: column; gap: 12px; justify-content: center; min-width: 0; }
  .node { align-self: center; position: relative; z-index: 1; background: var(--node); color: var(--node-text);
    border-radius: 12px; padding: 14px 16px 12px; }
  .node .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .node b { font-size: 16px; font-weight: 600; }
  .node .mono { font-size: 11px; opacity: .7; }
  .node .bar { height: 3px; background: color-mix(in srgb, var(--node-text) 20%, transparent); border-radius: 99px; margin-top: 10px; overflow: hidden; }
  .node .bar i { display: block; height: 100%; width: 0; background: var(--accent); }

  .week { position: relative; z-index: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); }
  .week.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .week-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .week-head .info { flex: 1; min-width: 0; }
  .week-head .tag { font-size: 10.5px; letter-spacing: .08em; color: var(--muted); }
  .week-head .title { font-weight: 600; font-size: 14.5px; }
  .week-head .count { font-size: 11px; color: var(--muted); }
  .week.complete .count { color: var(--done); }
  .chev { color: var(--muted); transition: transform .2s; font-size: 18px; line-height: 1; }
  .week.open .chev { transform: rotate(90deg); }
  .topics { display: none; flex-wrap: wrap; gap: 8px; padding: 0 12px 14px; }
  .week.open .topics { display: flex; }

  .box { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; flex-shrink: 0; margin: 0; cursor: pointer;
    border: 1.5px solid #c9ccd2; border-radius: 6px; background: var(--card); display: grid; place-items: center; }
  .box:checked { background: var(--done); border-color: var(--done); }
  .box:checked::after { content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  .box.partial { border-color: var(--done); }
  .box.partial::after { content: ""; width: 8px; height: 2px; background: var(--done); }

  .chip { display: flex; align-items: center; gap: 8px; background: var(--chip); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 10px 6px 7px; font-size: 13.5px; cursor: pointer; max-width: 100%; }
  .chip:hover { border-color: var(--accent); }
  .chip.active { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .chip.done span { color: var(--muted); text-decoration: line-through; }
  .chip .box { width: 18px; height: 18px; }
  .next { font-size: 10.5px; font-weight: 600; background: var(--accent); color: #fff; padding: 1px 7px; border-radius: 99px; }

  /* painel lateral */
  aside { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100%; background: var(--card);
    border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .25s; z-index: 10;
    display: flex; flex-direction: column; }
  body.drawer-open aside { transform: none; }
  .d-body { flex: 1; overflow-y: auto; padding: 22px 26px; }
  .crumbs { font-size: 12.5px; color: var(--muted); padding-right: 30px; }
  .crumbs b { color: var(--text); font-weight: 600; }
  .close { position: absolute; top: 14px; right: 14px; border: 0; background: none; font-size: 22px; padding: 4px 8px; color: var(--muted); }
  .d-week { margin-top: 20px; font-size: 11px; letter-spacing: .08em; color: var(--muted); }
  aside h2 { font-size: 28px; margin: 4px 0 14px; letter-spacing: -0.02em; line-height: 1.2; }
  .mark { display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; }
  .d-label { display: flex; justify-content: space-between; margin: 24px 0 8px; font-size: 11px; letter-spacing: .08em; color: var(--muted); }
  .res { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
    text-decoration: none; color: var(--text); margin-bottom: 8px; }
  .res:hover { border-color: var(--accent); }
  .res .ic { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center;
    background: var(--chip); font: 700 12px Inter, sans-serif; color: var(--muted); }
  .res .ic.video { color: #e03131; }
  .res b { display: block; font-weight: 600; font-size: 14px; line-height: 1.35; }
  .res .meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .res .type { background: var(--node); color: var(--node-text); font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; text-transform: capitalize; }
  .d-nav { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); padding: 14px 26px; }
  .d-nav button { border: 0; padding: 0; background: none; text-align: left; max-width: 48%; border-radius: 0; }
  .d-nav button:last-child { text-align: right; }
  .d-nav small { display: block; color: var(--muted); font-size: 12px; }
  .d-nav span { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-nav button:disabled { visibility: hidden; }

  footer { margin-top: 48px; color: var(--muted); font-size: 13px; text-align: center; }
  footer a { color: var(--muted); }

  @media (max-width: 1500px) { body.drawer-open .wrap { margin-right: 420px; } }
  @media (max-width: 1100px) {
    body.drawer-open .wrap { margin-right: auto; }
    .map::before, .cat svg { display: none; }
    .cat { grid-template-columns: 1fr; row-gap: 12px; padding: 18px 0; }
    .node { order: -1; align-self: stretch; }
  }
  @media (max-width: 600px) {
    .wrap { padding: 28px 16px 64px; }
    header h1 { font-size: 26px; }
    .logo { width: 32px; height: 32px; font-size: 18px; }
    aside h2 { font-size: 24px; }
    .d-body { padding: 20px 18px; }
    .d-nav { padding: 12px 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="logo">M</span>Roadmap do Maicon</h1>
    <div class="sub">24 semanas</div>
    <div class="goal"><b>Objetivo:</b> chegar pronto às entrevistas de Java Backend, dominando algoritmos, fundamentos de backend e System Design.</div>
    <div class="overall"><span id="pct" class="mono">0%</span><span class="bar"><i id="bar"></i></span><span id="totals"></span></div>
    <div class="tools">
      <button id="toggle-all">Expandir tudo</button>
      <button id="export">Exportar progresso</button>
      <label class="btn">Importar progresso<input id="import" type="file" accept="application/json" hidden></label>
      <button id="reset">Zerar</button>
    </div>
  </header>

  <main class="map" id="map"></main>

  <footer>
    Tópicos e links baseados no roadmap do
    <a href="https://ganeko-roadmap.vercel.app" target="_blank" rel="noopener">Ganeko</a>.
    Seu progresso fica salvo neste navegador.
  </footer>
</div>

<aside id="drawer" aria-label="Detalhes do tópico">
  <button class="close" id="close" aria-label="Fechar">×</button>
  <div class="d-body">
    <div class="crumbs" id="d-crumbs"></div>
    <div class="d-week mono" id="d-week"></div>
    <h2 id="d-title"></h2>
    <label class="mark"><input type="checkbox" class="box" id="d-check"> Marcar como visto</label>
    <div class="d-label mono"><span>MATERIAL</span><span id="d-count"></span></div>
    <div id="d-res"></div>
  </div>
  <div class="d-nav">
    <button id="d-prev"><small>← Anterior</small><span></span></button>
    <button id="d-next"><small>Próximo →</small><span></span></button>
  </div>
</aside>

<script src="data.js"></script>
<script>
  const KEY = "maicon-roadmap-progress";
  const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const $ = id => document.getElementById(id);

  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} };

  // lista plana de tópicos, na ordem das semanas
  const ALL = [];
  const weeks = WEEKS.map(([num, cat, title, topics]) => {
    const id = "semana-" + pad(num);
    const ids = topics.map(([name, res]) => {
      const tid = id + "-" + slug(name);
      ALL.push({ id: tid, week: id, num, cat, wtitle: title, name, res });
      return tid;
    });
    return { id, num, cat, title, ids };
  });
  const byId = Object.fromEntries(ALL.map(t => [t.id, t]));
  const categories = [...new Set(weeks.map(w => w.cat))];
  let current = null;

  function weekHtml(w) {
    return `<div class="week" id="${w.id}">
      <div class="week-head">
        <input type="checkbox" class="box week-box" aria-label="Marcar semana inteira">
        <div class="info"><div class="tag mono">SEMANA ${pad(w.num)}</div><div class="title">${esc(w.title)}</div></div>
        <span class="count mono"></span><span class="chev">›</span>
      </div>
      <div class="topics">${w.ids.map(tid => `<div class="chip" data-id="${tid}">
        <input type="checkbox" class="box" aria-label="Marcar ${esc(byId[tid].name)}"><span>${esc(byId[tid].name)}</span></div>`).join("")}
      </div></div>`;
  }

  function render() {
    $("map").innerHTML = categories.map(cat => {
      const ws = weeks.filter(w => w.cat === cat);
      return `<section class="cat" data-cat="${esc(cat)}"><svg></svg>
        <div class="col left">${ws.filter((_, i) => i % 2 === 0).map(weekHtml).join("")}</div>
        <div class="node"><div class="row"><b>${esc(cat)}</b><span class="mono"></span></div><div class="bar"><i></i></div></div>
        <div class="col right">${ws.filter((_, i) => i % 2 === 1).map(weekHtml).join("")}</div>
      </section>`;
    }).join("");
    refresh();
  }

  function refresh() {
    const next = ALL.find(t => !progress[t.id]);
    document.querySelectorAll(".chip").forEach(c => {
      const done = !!progress[c.dataset.id];
      c.classList.toggle("done", done);
      c.classList.toggle("active", c.dataset.id === current);
      c.querySelector("input").checked = done;
      const badge = c.querySelector(".next");
      if (next && c.dataset.id === next.id) { if (!badge) c.insertAdjacentHTML("beforeend", '<span class="next">Próximo</span>'); }
      else if (badge) badge.remove();
    });
    const perCat = {};
    weeks.forEach(w => {
      const d = w.ids.filter(id => progress[id]).length;
      const el = $(w.id);
      el.querySelector(".count").textContent = `${d}/${w.ids.length}`;
      el.classList.toggle("complete", d === w.ids.length);
      const box = el.querySelector(".week-box");
      box.checked = d === w.ids.length;
      box.classList.toggle("partial", d > 0 && d < w.ids.length);
      const c = perCat[w.cat] = perCat[w.cat] || [0, 0];
      c[0] += d; c[1] += w.ids.length;
    });
    document.querySelectorAll(".cat").forEach(s => {
      const [d, t] = perCat[s.dataset.cat];
      s.querySelector(".node .mono").textContent = `${d}/${t}`;
      s.querySelector(".node .bar i").style.width = (d / t * 100) + "%";
    });
    const done = ALL.filter(t => progress[t.id]).length;
    const pct = Math.round(done / ALL.length * 100);
    $("pct").textContent = pct + "%";
    $("bar").style.width = pct + "%";
    $("totals").textContent = `${done} de ${ALL.length} tópicos`;
    if (current) fillDrawer();
  }

  // curvas ligando cada semana ao nó da seção
  function drawCurves() {
    document.querySelectorAll(".cat").forEach(sec => {
      const svg = sec.querySelector("svg");
      if (getComputedStyle(svg).display === "none") return;
      const base = sec.getBoundingClientRect();
      const node = sec.querySelector(".node").getBoundingClientRect();
      const ny = node.top + node.height / 2 - base.top;
      svg.innerHTML = [...sec.querySelectorAll(".week-head")].map(h => {
        const r = h.getBoundingClientRect();
        const left = h.closest(".left") !== null;
        const x1 = (left ? r.right : r.left) - base.left, y1 = r.top + r.height / 2 - base.top;
        const x2 = (left ? node.left : node.right) - base.left;
        const mx = (x1 + x2) / 2;
        return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${ny} ${x2},${ny}"/>`;
      }).join("");
    });
  }

  function setUrl(topic) {
    const url = new URL(location);
    if (topic) url.searchParams.set("topic", topic); else url.searchParams.delete("topic");
    history.replaceState(null, "", url);
  }

  function toggleWeek(el, open) {
    el.classList.toggle("open", open);
    drawCurves();
    updateToggleAll();
  }

  function updateToggleAll() {
    const allOpen = [...document.querySelectorAll(".week")].every(w => w.classList.contains("open"));
    $("toggle-all").textContent = allOpen ? "Recolher tudo" : "Expandir tudo";
  }

  function setDone(id, value) {
    if (value) progress[id] = true; else delete progress[id];
  }

  // painel lateral
  function openTopic(id) {
    current = id;
    const t = byId[id];
    toggleWeek($(t.week), true);
    document.body.classList.add("drawer-open");
    setUrl(id);
    refresh();
    setTimeout(drawCurves, 260);
  }

  function closeDrawer() {
    current = null;
    document.body.classList.remove("drawer-open");
    setUrl(null);
    refresh();
    setTimeout(drawCurves, 260);
  }

  function fillDrawer() {
    const t = byId[current];
    const i = ALL.indexOf(t);
    $("d-crumbs").innerHTML = `Roadmap › ${esc(t.cat)} › ${esc(t.wtitle)} › <b>${esc(t.name)}</b>`;
    $("d-week").textContent = "SEMANA " + pad(t.num);
    $("d-title").textContent = t.name;
    $("d-check").checked = !!progress[t.id];
    $("d-count").textContent = t.res.length;
    $("d-res").innerHTML = t.res.map(r => {
      const [name, type, url] = RESOURCES[r];
      const host = new URL(url).hostname.replace(/^www\./, "");
      const icon = type === "video" ? "▶" : type[0].toUpperCase();
      return `<a class="res" href="${url}" target="_blank" rel="noopener"><span class="ic ${type}">${icon}</span>
        <span><b>${esc(name)}</b><span class="meta"><span class="type">${type}</span>${host}</span></span></a>`;
    }).join("");
    const prev = ALL[i - 1], next = ALL[i + 1];
    $("d-prev").disabled = !prev;
    $("d-next").disabled = !next;
    $("d-prev").querySelector("span").textContent = prev ? prev.name : "";
    $("d-next").querySelector("span").textContent = next ? next.name : "";
  }

  $("map").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (chip) {
      if (e.target.matches("input")) { setDone(chip.dataset.id, e.target.checked); save(); refresh(); }
      else openTopic(chip.dataset.id);
      return;
    }
    const head = e.target.closest(".week-head");
    if (!head) return;
    const el = head.closest(".week");
    const w = weeks.find(x => x.id === el.id);
    if (e.target.matches(".week-box")) {
      w.ids.forEach(id => setDone(id, e.target.checked));
      save(); refresh();
      return;
    }
    toggleWeek(el, !el.classList.contains("open"));
  });

  $("d-check").onchange = e => { setDone(current, e.target.checked); save(); refresh(); };
  $("d-prev").onclick = () => openTopic(ALL[ALL.indexOf(byId[current]) - 1].id);
  $("d-next").onclick = () => openTopic(ALL[ALL.indexOf(byId[current]) + 1].id);
  $("close").onclick = closeDrawer;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && current) closeDrawer(); });

  $("toggle-all").onclick = () => {
    const open = $("toggle-all").textContent.startsWith("Expandir");
    document.querySelectorAll(".week").forEach(w => w.classList.toggle("open", open));
    drawCurves(); updateToggleAll();
  };
  $("reset").onclick = () => { if (confirm("Zerar todo o progresso?")) { progress = {}; save(); refresh(); } };
  $("export").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(progress, null, 2)], { type: "application/json" }));
    a.download = "roadmap-progresso.json";
    a.click();
  };
  $("import").onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    try { progress = JSON.parse(await f.text()); save(); refresh(); } catch (err) { alert("Arquivo inválido."); }
    e.target.value = "";
  };

  render();
  window.addEventListener("resize", drawCurves);
  document.fonts && document.fonts.ready.then(drawCurves);

  const focus = new URLSearchParams(location.search).get("topic");
  if (focus && byId[focus]) openTopic(focus);
  else if (focus && $(focus)) {
    toggleWeek($(focus), true);
    $(focus).classList.add("focus");
    $(focus).scrollIntoView({ block: "center" });
  }
  drawCurves();
</script>
</body>
</html>
